<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reverb 알림 센터</title>
  <link href="/style.css" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#notifications-list">알림 목록으로 건너뛰기</a>

  <div class="app-shell">
    <header class="utility-bar" aria-label="연결 상태">
      <div class="utility-bar__status">
        <div class="status-pill">
          <span id="connection-dot" class="status-dot offline" aria-hidden="true"></span>
          <span id="connection-label">오프라인</span>
        </div>
        <strong id="device-name" class="utility-bar__device">연결 대기 중</strong>
        <span id="battery-text" class="utility-bar__battery">확인 중</span>
      </div>

      <p id="connection-summary" class="utility-bar__summary" aria-live="polite"></p>

      <div class="utility-bar__actions">
        <button id="btn-open-forwarding" type="button" class="link-button">전달 규칙</button>
        <button id="btn-ring" type="button" class="link-button">폰 찾기</button>
        <button id="btn-test" type="button" class="link-button">테스트</button>
      </div>
    </header>

    <main class="workspace">
      <section class="feed-panel" aria-labelledby="feed-title">
        <div class="panel-heading panel-heading--feed">
          <div class="panel-heading__title">
            <p class="eyebrow">Live Feed</p>
            <h2 id="feed-title">알림 스트림</h2>
          </div>

          <div class="panel-heading__meta">
            <span id="results-count">0개 알림</span>
            <button id="btn-clear-feed" type="button" class="link-button">목록 비우기</button>
          </div>
        </div>

        <section class="feed-tools" aria-label="알림 필터">
          <div class="field field--chips">
            <div id="category-filters" class="chip-row" role="group" aria-label="카테고리 필터">
              <button type="button" class="chip is-active" data-category="all">전체</button>
              <button type="button" class="chip" data-category="sms">메시지</button>
              <button type="button" class="chip" data-category="call">전화</button>
              <button type="button" class="chip" data-category="media">미디어</button>
              <button type="button" class="chip" data-category="generic">기타</button>
            </div>
          </div>
        </section>

        <div id="notifications-list" class="notification-list" tabindex="-1"></div>

        <div id="empty-state" class="empty-state">
          <h3>표시할 알림이 없습니다</h3>
        </div>
      </section>

      <aside id="detail-panel" class="detail-panel" aria-labelledby="detail-title">
        <div class="detail-panel__header">
          <div>
            <p class="eyebrow">Focused View</p>
            <h2 id="detail-title">알림 상세</h2>
          </div>
          <button id="btn-close-detail" type="button" class="secondary-button detail-close">
            닫기
          </button>
        </div>

        <div id="detail-empty" class="detail-empty">
          <h3>알림을 선택하세요</h3>
        </div>

        <div id="detail-content" class="detail-content" hidden>
          <div class="detail-meta">
            <div>
              <p class="detail-meta__label">앱</p>
              <p id="detail-app" class="detail-meta__value"></p>
            </div>
            <div>
              <p class="detail-meta__label">수신 시각</p>
              <p id="detail-time" class="detail-meta__value"></p>
            </div>
            <div>
              <p class="detail-meta__label">카테고리</p>
              <p id="detail-category" class="detail-meta__value"></p>
            </div>
          </div>

          <article class="detail-message">
            <h3 id="detail-sender"></h3>
            <p id="detail-text"></p>
          </article>

          <section id="reply-section" class="reply-section" hidden aria-labelledby="reply-title">
            <div class="reply-section__header">
              <div><h3 id="reply-title">빠른 답장</h3></div>
            </div>

            <label class="field">
              <span class="field__label">답장 내용</span>
              <textarea id="reply-input" rows="4" placeholder="보낼 답장을 입력하세요"></textarea>
            </label>

            <div class="reply-actions">
              <button id="btn-send" type="button" class="primary-button">답장 보내기</button>
            </div>
          </section>
        </div>
      </aside>
    </main>
  </div>

  <aside id="forwarding-drawer" class="drawer" aria-labelledby="drawer-title" hidden>
    <div class="drawer__surface">
      <div class="drawer__header">
        <div>
          <p class="eyebrow">Forwarding Rules</p>
          <h2 id="drawer-title">전달 규칙</h2>
        </div>
        <button id="btn-close-forwarding" type="button" class="secondary-button">닫기</button>
      </div>

      <p class="drawer__summary">
        이 규칙은 Android 앱에서 관리하는 전달 필터와 연결됩니다. 여기서는 모드를 바꾸고 등록된 패키지를 제거할 수 있습니다.
      </p>

      <fieldset class="drawer__fieldset">
        <legend>필터 모드</legend>
        <label class="radio-row">
          <input type="radio" name="forwarding-mode" value="blacklist" />
          <span>차단 목록: 선택한 앱만 제외</span>
        </label>
        <label class="radio-row">
          <input type="radio" name="forwarding-mode" value="whitelist" />
          <span>허용 목록: 선택한 앱만 전달</span>
        </label>
      </fieldset>

      <div class="drawer__packages">
        <div class="drawer__packages-header">
          <h3>등록된 패키지</h3>
          <button id="btn-refresh-forwarding" type="button" class="link-button">새로고침</button>
        </div>
        <ul id="forwarding-packages" class="package-list"></ul>
        <p id="forwarding-empty" class="drawer__empty">등록된 패키지가 없습니다.</p>
      </div>
    </div>
  </aside>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

  <script src="/app.js"></script>
</body>
</html>
